<body>

import * as THREE from 'three';
const host=document.querySelector('#space'),caption=document.querySelector('#caption'),nameEl=document.querySelector('#planet-name'),descEl=document.querySelector('#planet-description'),progress=document.querySelector('#progress');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x000000);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,1800);camera.position.set(0,0,11.6);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.18;host.appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0x8492b2,.34));const sunLight=new THREE.PointLight(0xffffff,180,0,1.35);scene.add(sunLight);
const loader=new THREE.TextureLoader();const textureCache=new Map();
function makeTexture(kind,base,seed=1){const key=kind+base;if(textureCache.has(key))return textureCache.get(key);const c=document.createElement('canvas');c.width=1024;c.height=512;const x=c.getContext('2d');x.fillStyle=base;x.fillRect(0,0,1024,512);let s=seed;const rand=()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296};
if(kind==='sun'){const g=x.createLinearGradient(0,0,1024,512);g.addColorStop(0,'#7b2307');g.addColorStop(.25,'#ff8a16');g.addColorStop(.55,'#ffd16a');g.addColorStop(.78,'#f66a0b');g.addColorStop(1,'#a52b05');x.fillStyle=g;x.fillRect(0,0,1024,512);for(let i=0;i<1700;i++){x.fillStyle=rand()>.5?'rgba(255,242,165,.12)':'rgba(110,20,0,.12)';x.fillRect(rand()*1024,rand()*512,rand()*70+3,rand()*3+1)}}
else if(kind==='earth'){for(let i=0;i<1100;i++){let px=rand()*1024,py=rand()*512,rx=rand()*85+8,ry=rand()*35+4;x.fillStyle=rand()>.46?'#315a37':'#6b8e49';x.globalAlpha=.25+rand()*.65;x.beginPath();x.ellipse(px,py,rx,ry,rand()*3,0,Math.PI*2);x.fill()}x.globalAlpha=1;for(let i=0;i<500;i++){x.fillStyle='rgba(255,255,255,.17)';x.beginPath();x.ellipse(rand()*1024,rand()*512,rand()*38+4,rand()*8+2,0,0,7);x.fill()}}
else if(kind==='gas'||kind==='saturn'){for(let i=0;i<80;i++){const y=rand()*512,h=rand()*20+2;x.fillStyle=rand()>.5?'rgba(255,235,197,.22)':'rgba(40,20,12,.18)';x.fillRect(0,y,1024,h)}if(kind==='gas'){for(let i=0;i<9;i++){x.fillStyle='rgba(130,49,30,.65)';x.beginPath();x.ellipse(rand()*1024,rand()*512,rand()*40+10,rand()*13+4,0,0,7);x.fill()}}}
else if(kind==='ice'){for(let i=0;i<180;i++){x.fillStyle='rgba(255,255,255,'+(rand()*.16)+')';x.fillRect(0,rand()*512,1024,rand()*5+1)}}
else if(kind==='mars'){for(let i=0;i<650;i++){x.fillStyle=rand()>.5?'rgba(255,188,120,.3)':'rgba(65,20,9,.25)';x.beginPath();x.ellipse(rand()*1024,rand()*512,rand()*30+2,rand()*15+2,0,0,7);x.fill()}}
else{for(let i=0;i<1300;i++){x.fillStyle='rgba(255,255,255,'+(rand()*.16)+')';x.beginPath();x.arc(rand()*1024,rand()*512,rand()*2+.2,0,7);x.fill()}}
const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=4;textureCache.set(key,t);
const assetMap={
'#ff8b1a':'2k_sun.jpg','#174c8b':'2k_earth_daymap.jpg','#a7b7c4':'2k_earth_clouds.jpg',
'#777b83':'2k_moon.jpg','#a6472b':'2k_mars.jpg','#c6a17b':'2k_jupiter.jpg',
'#b9a17b':'2k_saturn.jpg','#7dc9d2':'2k_uranus.jpg','#235bba':'2k_neptune.jpg'
};
const asset=assetMap[base];
if(asset){loader.load('https://www.solarsystemscope.com/textures/download/'+asset,loaded=>{t.image=loaded.image;t.needsUpdate=true;},undefined,()=>{});}
return t}
function sphere(radius,material,segments=64){return new THREE.Mesh(new THREE.SphereGeometry(radius,segments,Math.max(24,segments/2)),material)}
function bodyMaterial(kind,color,seed){return new THREE.MeshStandardMaterial({map:makeTexture(kind,color,seed),roughness:.92,metalness:0})}
const starsGeo=new THREE.BufferGeometry(),starCount=2600,starPos=new Float32Array(starCount*3),starSizes=new Float32Array(starCount);for(let i=0;i<starCount;i++){const r=100+Math.random()*450,a=Math.random()*Math.PI*2,z=Math.random()*2-1,q=Math.sqrt(1-z*z);starPos[i*3]=r*q*Math.cos(a);starPos[i*3+1]=r*z;starPos[i*3+2]=r*q*Math.sin(a);starSizes[i]=Math.random()}starsGeo.setAttribute('position',new THREE.BufferAttribute(starPos,3));const starMat=new THREE.PointsMaterial({color:0xdfe7ff,size:.7,sizeAttenuation:true,transparent:true,opacity:.78,depthWrite:false});scene.add(new THREE.Points(starsGeo,starMat));
const dustGeo=new THREE.BufferGeometry(),dustCount=700,dustPos=new Float32Array(dustCount*3);for(let i=0;i<dustCount;i++){dustPos[i*3]=(Math.random()-.5)*80;dustPos[i*3+1]=(Math.random()-.5)*50;dustPos[i*3+2]=-25-Math.random()*80}dustGeo.setAttribute('position',new THREE.BufferAttribute(dustPos,3));scene.add(new THREE.Points(dustGeo,new THREE.PointsMaterial({color:0x66728e,size:.018,transparent:true,opacity:.5})));
const subjects=[];
function addSubject(title,description,make,scale=1){const root=new THREE.Group();scene.add(root);make(root);root.scale.setScalar(scale);subjects.push({title,description,root,scale});return root}
function glow(parent,r,color,opacity){const m=new THREE.MeshBasicMaterial({color,transparent:true,opacity,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.BackSide});const g=sphere(r,m,48);parent.add(g);return g}

let sun;addSubject('Солнце','Звезда, чьё притяжение удерживает планеты на орбитах.',root=>{sun=sphere(2.05,new THREE.MeshBasicMaterial({map:makeTexture('sun','#ff8b1a',8)}),96);root.add(sun);glow(root,2.28,0xff6b18,.38);glow(root,2.7,0xff4a0a,.12);glow(root,3.25,0xff8b2b,.045);const corona=new THREE.Points(new THREE.BufferGeometry(),new THREE.PointsMaterial({color:0xffa34b,size:.045,transparent:true,opacity:.65,depthWrite:false}));const p=[];for(let i=0;i<1200;i++){let a=Math.random()*Math.PI*2,r=2.15+Math.random()*1.25;p.push(Math.cos(a)*r,(Math.random()-.5)*.13,Math.sin(a)*r)}corona.geometry.setAttribute('position',new THREE.Float32BufferAttribute(p,3));root.add(corona);root.userData.corona=corona},1);
let earthMoon;addSubject('Земля и Луна','Наш дом: голубая планета, облака и её естественный спутник.',root=>{const e=new THREE.Group();root.add(e);const globe=sphere(1.65,bodyMaterial('earth','#174c8b',17),96);e.add(globe);const clouds=sphere(1.68,new THREE.MeshStandardMaterial({map:makeTexture('gas','#a7b7c4',29),transparent:true,opacity:.12,roughness:1,depthWrite:false}),72);e.add(clouds);const at=sphere(1.72,new THREE.MeshBasicMaterial({color:0x4b9dff,transparent:true,opacity:.075,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false}),72);e.add(at);earthMoon=moon(root,.38,3.1,0xb4b8c0,'rock',.55,3);earthMoon.mesh.material=bodyMaterial('rock','#777b83',3);root.userData.earth=e;root.userData.clouds=clouds},1);
let marsMoons;addSubject('Марс','Ржавая пустыня, каньоны и два крошечных спутника — Фобос и Деймос.',root=>{root.add(sphere(1.25,bodyMaterial('mars','#a6472b',22),80));marsMoons=[moon(root,.15,1.9,0xaaa39b,'rock',1.6,7),moon(root,.09,2.45,0x766f6c,'rock',-.8,9)]},1.05);
let jupiterMoons;addSubject('Юпитер','Газовый гигант с полосатыми облаками и четырьмя галилеевыми спутниками.',root=>{root.add(sphere(2.05,bodyMaterial('gas','#c6a17b',31),96));jupiterMoons=[moon(root,.2,2.7,0xc9b18a,'rock',.9,1),moon(root,.17,3.15,0x9d9583,'rock',.62,2),moon(root,.29,3.7,0xb0a08a,'rock',.42,3),moon(root,.25,4.3,0x7b6c59,'rock',.3,4)]},1);
addSubject('Сатурн','Ледяные и каменные кольца, растянутые на сотни тысяч километров.',root=>{const sat=sphere(1.48,bodyMaterial('saturn','#b9a17b',44),88);root.add(sat);ring(root,1.9,2.65,0xc9b38c,.82);ring(root,2.72,3.4,0x847762,.55);ring(root,3.45,3.68,0xd5c4a4,.28);root.userData.ring=true},1.05);
addSubject('Уран','Холодный ледяной гигант, вращающийся почти на боку.',root=>{const p=sphere(1.38,bodyMaterial('ice','#7dc9d2',56),80);p.rotation.z=1.45;root.add(p);ring(root,1.7,1.95,0x7fcbd5,.3)},1);
addSubject('Нептун','Далёкий синий мир с быстрыми ветрами и динамичной атмосферой.',root=>{root.add(sphere(1.35,bodyMaterial('ice','#235bba',61),80));glow(root,1.43,0x2d70ff,.12)},1);
function makeISS(root){const metal=new THREE.MeshStandardMaterial({color:0xc4cbd1,metalness:.8,roughness:.3}),gold=new THREE.MeshStandardMaterial({color:0xd6a846,metalness:.45,roughness:.42}),blue=new THREE.MeshStandardMaterial({color:0x1a4c96,metalness:.3,roughness:.4});const bar=(x,y,z,sx,sy,sz,mat)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz),mat);m.position.set(x,y,z);root.add(m);return m};bar(0,0,0,1.7,.16,.18,metal);bar(-.65,.1,0,.55,.35,.38,gold);bar(.1,.3,0,.32,.35,.3,metal);bar(.9,.1,0,.38,.3,.32,metal);for(const side of [-1,1]){bar(side*1.65,.02,0,1.2,.045,.72,blue);bar(side*1.65,.02,0,1.18,.055,.05,gold);bar(side*2.9,.02,0,.06,.1,.8,metal)}const truss=bar(0,-.18,0,4.5,.04,.08,gold);truss.rotation.z=.08;for(let i=0;i<4;i++){const a=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.8,8),metal);a.rotation.z=Math.PI/2;a.position.set(-1.4+i*.9,-.25,0);root.add(a)}}
addSubject('МКС','Международная космическая станция — лаборатория на орбите Земли.',root=>{makeISS(root);glow(root,3,0x4779bd,.025)},.9);
addSubject('Спутники и аппараты','Искусственные спутники и исследовательские аппараты, изучающие космос.',root=>{const gold=new THREE.MeshStandardMaterial({color:0xbba36f,metalness:.65,roughness:.3}),panel=new THREE.MeshStandardMaterial({color:0x174c9a,metalness:.35,roughness:.4}),body=sphere(.48,gold,32);root.add(body);const boom=new THREE.Mesh(new THREE.CylinderGeometry(.045,.045,2.5,12),gold);boom.rotation.z=Math.PI/2;root.add(boom);for(const side of [-1,1]){const m=new THREE.Mesh(new THREE.BoxGeometry(1.3,.06,.8),panel);m.position.x=side*1.25;root.add(m);for(let i=0;i<5;i++){const line=new THREE.Mesh(new THREE.BoxGeometry(.018,.07,.8),gold);line.position.set(side*1.25+(i-2)*.22,.005,0);root.add(line)}}const dish=new THREE.Mesh(new THREE.SphereGeometry(.42,24,12,0,Math.PI*2,0,Math.PI/2),new THREE.MeshStandardMaterial({color:0xcbd0d5,metalness:.65,roughness:.28,side:THREE.DoubleSide}));dish.position.y=.45;dish.rotation.x=-Math.PI/2;root.add(dish)},1);
let current=0,transition=0,fromPos=new THREE.Vector3(0,0,14),toPos=new THREE.Vector3(0,0,14),fromTarget=new THREE.Vector3(),toTarget=new THREE.Vector3(),target=new THREE.Vector3(),yaw=0,pitch=0,dragging=false,lastX=0,lastY=0,dragStart=0,elapsed=0,hold=0,swipeMoved=false;const clock=new THREE.Clock();const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const viewTarget=new THREE.Vector3();const desiredCamera=new THREE.Vector3();
function cameraFor(index){const item=subjects[index],r=index===0?11.6:index===7?9.8:index===8?9.4:Math.max(7.8,item.scale*5.7);return new THREE.Vector3(r*.1,r*.035,r)}
function showSubject(index,initial=false){current=(index+subjects.length)%subjects.length;subjects.forEach((subject,i)=>{subject.root.visible=i===current});const item=subjects[current];caption.classList.add('out');const nextPos=cameraFor(current);fromPos.copy(camera.position);toPos.copy(nextPos);fromTarget.copy(target);toTarget.set(0,0,0);transition=initial?1:0;hold=0;setTimeout(()=>{nameEl.textContent=item.title;descEl.textContent=item.description;caption.classList.remove('out')},initial?0:280)}
showSubject(0,true);camera.position.copy(cameraFor(0));document.querySelector('#loader').classList.add('done');setTimeout(()=>document.querySelector('#loader')?.remove(),1000);
function onDown(e){dragging=true;swipeMoved=false;lastX=e.clientX;lastY=e.clientY;dragStart=performance.now();renderer.domElement.setPointerCapture?.(e.pointerId)}function onMove(e){if(!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;if(Math.abs(dx)+Math.abs(dy)>2)swipeMoved=true;yaw+=dx*.006;pitch=Math.max(-1.15,Math.min(1.15,pitch+dy*.004));lastX=e.clientX;lastY=e.clientY;hold=0}function onUp(){dragging=false}renderer.domElement.addEventListener('pointerdown',onDown);renderer.domElement.addEventListener('pointermove',onMove);renderer.domElement.addEventListener('pointerup',onUp);renderer.domElement.addEventListener('pointercancel',onUp);renderer.domElement.addEventListener('pointerleave',onUp);
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);elapsed+=dt;hold+=dt;subjects.forEach((o,i)=>{o.root.rotation.y+=dt*(i===0?.045:.11);o.root.rotation.x=Math.sin(elapsed*.13+i)*.025;if(o.root.userData.corona)o.root.userData.corona.rotation.y=-elapsed*.045;if(o.root.userData.earth){o.root.userData.earth.rotation.y+=dt*.12;o.root.userData.clouds.rotation.y-=dt*.035} });if(earthMoon){earthMoon.pivot.rotation.y+=dt*earthMoon.speed;earthMoon.mesh.rotation.y+=dt*.3}if(marsMoons) marsMoons.forEach(m=>{m.pivot.rotation.y+=dt*m.speed;m.mesh.rotation.y+=dt*.2});if(jupiterMoons)jupiterMoons.forEach(m=>{m.pivot.rotation.y+=dt*m.speed;m.mesh.rotation.y+=dt*.25});if(!dragging){yaw*=Math.pow(.94,dt*60);pitch*=Math.pow(.94,dt*60)}if(transition<1){transition=Math.min(1,transition+dt/(reduced?.01:1.55));const t=transition*transition*(3-2*transition);camera.position.lerpVectors(fromPos,toPos,t);target.lerpVectors(fromTarget,toTarget,t)}const active=subjects[current].root;const dist=camera.position.length();const angle=elapsed*.015+yaw;desiredCamera.set(Math.sin(angle)*dist*Math.cos(pitch),Math.sin(pitch)*dist,Math.cos(angle)*dist*Math.cos(pitch));if(!dragging&&transition>=1){camera.position.lerp(desiredCamera,.035)}else if(dragging){const d=camera.position.length();camera.position.set(Math.sin(yaw)*d*Math.cos(pitch),Math.sin(pitch)*d,Math.cos(yaw)*d*Math.cos(pitch))}camera.lookAt(target);const duration=reduced?11:9;if(hold>duration&&!dragging){showSubject(current+1);hold=0}progress.style.width=(Math.min(1,hold/duration)*100)+'%';renderer.render(scene,camera)}
